spring:
  datasource:
    url: jdbc:h2:mem:vehicle_platform_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

app:
  demo-mode: true
  jwt:
    secret: test-secret-key-for-unit-tests-only-not-for-production-use-0123456789
    expiration-minutes: 60
